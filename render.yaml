databases:
  - name: github-timeline-db
    databaseName: github_timeline
    user: github_timeline_user
    plan: free

services:
  - type: web
    name: github-timeline
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: github-timeline-db
          property: connectionString
      - key: GITHUB_TOKEN
        sync: false
